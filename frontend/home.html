<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista ofert pracy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="scripts/theme.js"></script>
    <script src="scripts/script.js"></script>
</head>

<body>
    <nav class="main-navbar">
        <div class="navbar-container">
            <a href="home.html" class="navbar-logo">JobOffers</a>
            <ul class="navbar-links">
                <li><a href="home.html">Strona Główna</a></li>
                <li><a href="admin.html">Panel Administratora</a></li>
                <li><button id="themeToggleBtn">🌙 Ciemny</button></li>
            </ul>
        </div>
    </nav>

    <section class="search-section">
        <p class="search-title">Przeglądaj oferty pracy</p>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Szukaj ofert..." id="searchInput">
            <button class="btn-primary" onclick="searchOffers()">Szukaj</button>
        </div>
        <div class="sort-container">
            <label for="sortSelect">Sortuj według:</label>
            <select id="sortSelect" onchange="changeSort()">
                <option value="id,desc">Najnowsze</option>
                <option value="earnings,asc">Płace: od najniższej</option>
                <option value="earnings,desc">Płace: od najwyższej</option>
                <option value="title,asc">Tytuł: A-Z</option>
                <option value="title,desc">Tytuł: Z-A</option>
            </select>
        </div>
        <p class="search-term">Wyszukana fraza: </p>
    </section>

    <main>
        <div class="page-section">
            <button class="btn-primary" onclick="previousPage()" id="previousPage" disabled>Poprzednia</button>
            <input type="number" class="page-number-input" id="pageNumber" value="0" disabled>
            <button class="btn-primary" onclick="nextPage()" id="nextPage">Następna</button>
        </div>
        <div class="loader-container">
            <p>Ładowanie ofert...</p>
            <div class="loader"></div>
        </div>
        <div class="error-container">
            <p class="error-message">Błąd podczas ładowania danych</p>
        </div>
        <div class="offers-list"></div>
    </main>

    <template id="jobCardTemplate">
        <div class="job-card">
            <div class="job-info">
                <div class="job-details">
                    <h2></h2>
                    <div class="job-meta">
                        <span class="meta-item"><i class="fas fa-building"></i>Firma: <span></span></span>
                        <span class="meta-item"><i class="fas fa-map-marker-alt"></i>Lokalizacja: <span></span></span>
                        <span class="meta-item"><i class="fas fa-calendar-alt"></i>Data dodania: <span></span></span>
                    </div>
                </div>
            </div>
            <div class="salary">
                <span class="salary-range"></span>
                <span class="salary-type">Stawka miesięczna netto</span>
            </div>
        </div>
    </template>
</body>

</html>
